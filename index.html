<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Campo Minato Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Campo Minato</h1>
    <div class="controls">
        <button onclick="startGame(9, 9, 10)">Principiante (9x9)</button>
        <button onclick="startGame(16, 16, 40)">Intermedio (16x16)</button>
        <button onclick="startGame(16, 30, 99)">Esperto (30x16)</button>
        <button id="theme-toggle" onclick="toggleTheme()">🌙 Notte</button>
    </div>
    <div class="info-bar">
        <span id="mine-counter">💣 10</span>
        <h2 id="status">Scegli una difficoltà o inizia a giocare!</h2>
    </div>
    <div id="grid-container">
        <div id="grid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
